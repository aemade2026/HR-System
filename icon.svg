<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Deep Tech Gradient -->
    <linearGradient id="aeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Cyber Gradients for Letterforms -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="crossbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Outer Glow Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.8)" />
      <stop offset="50%" stop-color="rgba(129, 140, 248, 0.4)" />
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0.8)" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#aeBg)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Background Biometric Fingerprint Concentric Rings -->
  <g fill="none" stroke="rgba(99, 102, 241, 0.16)" stroke-width="3" stroke-linecap="round">
    <path d="M 176 180 A 80 80 0 0 1 336 180" />
    <path d="M 136 180 A 120 120 0 0 1 376 180" />
    <path d="M 96 180 A 160 160 0 0 1 416 180" />
  </g>

  <!-- Monogram Glyph AE with Tech Aesthetics -->
  <g filter="url(#softGlow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter A (Left Angle & Right Diagonal) -->
    <path d="M 115 380 L 205 140 L 290 380" stroke="url(#cyanGrad)" stroke-width="26" />

    <!-- Unified Horizontal Power Bridge (A Crossbar merging across to E) -->
    <path d="M 155 275 L 410 275" stroke="url(#crossbarGrad)" stroke-width="26" />

    <!-- Letter E (Spine, Top Arm, Bottom Arm) -->
    <path d="M 315 140 L 315 380" stroke="url(#purpleGrad)" stroke-width="26" />
    <path d="M 315 140 L 425 140" stroke="url(#purpleGrad)" stroke-width="26" />
    <path d="M 315 380 L 425 380" stroke="url(#purpleGrad)" stroke-width="26" />

    <!-- Biometric Core Iris Pulse in A Apex -->
    <circle cx="205" cy="195" r="12" fill="#38bdf8" />
  </g>

  <!-- Verified Security Badge (Lower Right) -->
  <g filter="url(#badgeShadow)">
    <circle cx="400" cy="400" r="48" fill="#10b981" stroke="#0b1120" stroke-width="8" />
    <path d="M 382 402 L 395 415 L 422 388" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
