<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Cyber Space Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Core Ambient Bioluminescence -->
    <radialGradient id="ambientGlow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.38"/>
      <stop offset="40%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Rim Border Gradient -->
    <linearGradient id="squircleBorder" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Cyan Electric Gradient for 'A' -->
    <linearGradient id="aGrad" x1="130" y1="360" x2="250" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Violet / Purple Glow Gradient for 'E' -->
    <linearGradient id="eGrad" x1="290" y1="135" x2="390" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Luminous Bridge Connector Gradient -->
    <linearGradient id="bridgeGrad" x1="175" y1="260" x2="375" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Emerald Security Badge Gradient -->
    <linearGradient id="emeraldGrad" x1="330" y1="330" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <rect width="512" height="512" fill="url(#ambientGlow)"/>

  <!-- Squircle Glass Frame with 116px Radius -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="none" stroke="url(#squircleBorder)" stroke-width="4.5"/>

  <!-- Biometric Waves & GPS Radar Concentric Ripples -->
  <g fill="none" stroke="url(#squircleBorder)" opacity="0.16" stroke-linecap="round">
    <ellipse cx="256" cy="175" rx="85" ry="46" stroke-dasharray="6 6" stroke-width="2"/>
    <ellipse cx="256" cy="175" rx="135" ry="70" stroke-dasharray="8 8" stroke-width="2.5"/>
    <ellipse cx="256" cy="175" rx="185" ry="94" stroke-dasharray="10 10" stroke-width="2"/>
  </g>

  <!-- High-Tech AE Monogram Centerpiece -->
  <g filter="url(#neonBloom)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter 'A' Structure -->
    <path d="M 135 360 L 222 145 L 295 360" stroke="url(#aGrad)" stroke-width="30"/>

    <!-- Luminous Bridge connecting A & E crossbar -->
    <path d="M 172 260 L 378 260" stroke="url(#bridgeGrad)" stroke-width="26"/>

    <!-- Letter 'E' Structure -->
    <path d="M 310 145 L 310 360" stroke="url(#eGrad)" stroke-width="30"/>
    <path d="M 310 145 L 388 145" stroke="url(#eGrad)" stroke-width="30"/>
    <path d="M 310 360 L 388 360" stroke="url(#eGrad)" stroke-width="30"/>

    <!-- Biometric Pulse Core (Iris) in 'A' Apex -->
    <circle cx="222" cy="192" r="13" fill="#38bdf8"/>
    <circle cx="222" cy="192" r="5" fill="#ffffff"/>
  </g>

  <!-- Verified Security Badge (Strict Safe Zone at 370, 365) -->
  <g filter="url(#badgeShadow)">
    <circle cx="370" cy="365" r="40" fill="url(#emeraldGrad)" stroke="#070b14" stroke-width="6"/>
    <path d="M 356 367 L 367 378 L 386 354" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
