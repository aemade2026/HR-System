<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Cyber Space Gradient -->
    <linearGradient id="mBgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Core Ambient Bioluminescence -->
    <radialGradient id="mAmbientGlow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.38"/>
      <stop offset="40%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="mBorder" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="maGrad" x1="130" y1="360" x2="250" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="meGrad" x1="290" y1="135" x2="390" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="mbridgeGrad" x1="175" y1="260" x2="375" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="memeraldGrad" x1="330" y1="330" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="mneonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="mbadgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Full Bleed Background: Guarantees No White/Black Corners On Masking -->
  <rect width="512" height="512" fill="url(#mBgGrad)"/>
  <rect width="512" height="512" fill="url(#mAmbientGlow)"/>

  <!-- Centered Inner Artwork with 0.82 Scaling for Maskable Safe Zone -->
  <g transform="translate(256, 256) scale(0.82) translate(-256, -256)">
    <!-- Biometric Radar Ripples -->
    <g fill="none" stroke="url(#mBorder)" opacity="0.18" stroke-linecap="round">
      <ellipse cx="256" cy="175" rx="85" ry="46" stroke-dasharray="6 6" stroke-width="2"/>
      <ellipse cx="256" cy="175" rx="135" ry="70" stroke-dasharray="8 8" stroke-width="2.5"/>
      <ellipse cx="256" cy="175" rx="185" ry="94" stroke-dasharray="10 10" stroke-width="2"/>
    </g>

    <!-- High-Tech AE Monogram Centerpiece -->
    <g filter="url(#mneonBloom)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 135 360 L 222 145 L 295 360" stroke="url(#maGrad)" stroke-width="32"/>
      <path d="M 172 260 L 378 260" stroke="url(#mbridgeGrad)" stroke-width="28"/>
      <path d="M 310 145 L 310 360" stroke="url(#meGrad)" stroke-width="32"/>
      <path d="M 310 145 L 388 145" stroke="url(#meGrad)" stroke-width="32"/>
      <path d="M 310 360 L 388 360" stroke="url(#meGrad)" stroke-width="32"/>
      <circle cx="222" cy="192" r="14" fill="#38bdf8"/>
      <circle cx="222" cy="192" r="5" fill="#ffffff"/>
    </g>

    <!-- Verified Security Badge -->
    <g filter="url(#mbadgeShadow)">
      <circle cx="365" cy="360" r="38" fill="url(#memeraldGrad)" stroke="#070b14" stroke-width="6"/>
      <path d="M 352 362 L 362 372 L 380 350" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
